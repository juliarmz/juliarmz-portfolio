<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="#ffffff"/>
  <!-- plus glyph, top-left quadrant -->
  <g fill="#e0201b">
    <rect x="6" y="2" width="2" height="2"/>
    <rect x="4" y="4" width="2" height="2"/>
    <rect x="6" y="4" width="2" height="2"/>
    <rect x="8" y="4" width="2" height="2"/>
    <rect x="6" y="6" width="2" height="2"/>
  </g>
  <!-- x glyph, top-right quadrant -->
  <g fill="#e0201b">
    <rect x="20" y="2" width="2" height="2"/>
    <rect x="26" y="2" width="2" height="2"/>
    <rect x="22" y="4" width="2" height="2"/>
    <rect x="24" y="4" width="2" height="2"/>
    <rect x="20" y="6" width="2" height="2"/>
    <rect x="26" y="6" width="2" height="2"/>
  </g>
  <!-- diamond glyph, bottom-left quadrant -->
  <g fill="#e0201b">
    <rect x="6" y="18" width="2" height="2"/>
    <rect x="4" y="20" width="2" height="2"/>
    <rect x="8" y="20" width="2" height="2"/>
    <rect x="6" y="22" width="2" height="2"/>
  </g>
  <!-- filled square + dot, bottom-right quadrant -->
  <g fill="#e0201b">
    <rect x="20" y="18" width="4" height="4"/>
    <rect x="26" y="20" width="2" height="2"/>
  </g>
  <!-- small connecting dots -->
  <g fill="#e0201b">
    <rect x="14" y="0" width="2" height="2"/>
    <rect x="0" y="14" width="2" height="2"/>
    <rect x="16" y="16" width="2" height="2"/>
    <rect x="30" y="14" width="2" height="2"/>
    <rect x="14" y="30" width="2" height="2"/>
  </g>
</svg>
